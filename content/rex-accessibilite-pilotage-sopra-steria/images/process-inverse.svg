<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
<title id="t">Le processus inversé</title><desc id="d">Comparaison entre la démarche structurée et le processus inversé souvent observé : audit, schéma, plan d'action.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#151d34"/></marker></defs>
<g font-family="Arial,sans-serif" text-anchor="middle">
  <g class="fragment">
  <text x="300" y="70" font-size="30" font-weight="800" fill="#164791">OBSERVÉ</text>
  <rect x="130" y="125" width="340" height="105" rx="24" fill="#164791"/><text x="300" y="190" font-size="31" font-weight="800" fill="#fff">AUDITS</text>
  </g>
  <g class="fragment">
