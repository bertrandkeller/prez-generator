  <rect x="730" y="125" width="340" height="105" rx="24" fill="#164791"/><text x="900" y="190" font-size="31" font-weight="800" fill="#fff">SCHÉMA</text>
  </g>
  <g class="fragment">
  <path d="M900 230V285" stroke="#151d34" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="730" y="300" width="340" height="105" rx="24" fill="#fff" stroke="#164791" stroke-width="5"/><text x="900" y="365" font-size="31" font-weight="800" fill="#164791">PLAN D’ACTION</text>
  </g>
  <g class="fragment">
