  <rect x="130" y="300" width="340" height="105" rx="24" fill="#fff" stroke="#164791" stroke-width="5"/><text x="300" y="365" font-size="31" font-weight="800" fill="#164791">SCHÉMA</text>
  </g>
  <g class="fragment">
  <path d="M300 405V460" stroke="#151d34" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="130" y="475" width="340" height="105" rx="24" fill="#fff" stroke="#151d34" stroke-width="5"/><text x="300" y="540" font-size="31" font-weight="800" ffill="#151d34">PLAN D’ACTION</text>
  </g>

  <g class="fragment">
