<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Des indicateurs très concrets</title><style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}.bg{fill:#f7f6f2}.ink{fill:#151d34}.muted{fill:#657083}
    .blue{fill:#164791}.violet{fill:#4631d4}.cream{fill:#f3eee3}.white{fill:#fff}
    .title{font-size:42px;font-weight:800}.subtitle{font-size:22px}.eyebrow{font-size:17px;font-weight:800;letter-spacing:2px}
    .h2{font-size:27px;font-weight:800}.body{font-size:21px;font-weight:500}.small{font-size:17px}
    .wt{fill:#fff}
    </style><rect width="1600" height="900" class="bg"/><text x="90" y="82" class="title ink">Des indicateurs très concrets</text>
<text x="90" y="122" class="subtitle muted">Mesurer la maturité, ce n’est pas chercher un chiffre magique : on peut observer plusieurs familles d’indicateurs.</text>
<rect x="90" y="190" width="430" height="560" rx="28" class="blue"/><text x="125" y="245" class="eyebrow wt">01 · CAPACITÉS</text><text x="125" y="292" class="h2 wt">Capacités d’agir ?</text><text x="125" y="350" class="body wt">• gouvernance</text><text x="125" y="394" class="body wt">• budget et ressources</text><text x="125" y="438" class="body wt">• responsabilités</text><text x="125" y="482" class="body wt">• compétences disponibles</text><text x="125" y="526" class="body wt">• formation</text><text x="125" y="570" class="body wt">• réseau de référents</text>
<rect x="585" y="190" width="430" height="560" rx="28" class="violet"/><text x="620" y="245" class="eyebrow wt">02 · PRATIQUES</text><text x="620" y="292" class="h2 wt">Est-ce intégré au quotidien ?</text><text x="620" y="350" class="body wt">• accessibilité dans les projets</text><text x="620" y="394" class="body wt">• critères dans les achats</text><text x="620" y="438" class="body wt">• revues de conception</text><text x="620" y="482" class="body wt">• tests et contrôles</text><text x="620" y="526" class="body wt">• suivi des corrections</text><text x="620" y="570" class="body wt">• capitalisation</text>
<rect x="1080" y="190" width="430" height="560" rx="28" class="cream"/><text x="1115" y="245" class="eyebrow ink">03 · RÉSULTATS</text><text x="1115" y="292" class="h2 ink">Observe-t-on des progrès ?</text><text x="1115" y="350" class="body ink">• résultats d’évaluations</text><text x="1115" y="394" class="body ink">• tests utilisateurs</text><text x="1115" y="438" class="body ink">• retours et satisfaction</text><text x="1115" y="482" class="body ink">• évolution des problèmes</text><text x="1115" y="526" class="body ink">• délais de correction</text><text x="1115" y="570" class="body ink">• évolution des indicateurs</text>
<rect x="90" y="790" width="1420" height="60" rx="18" class="white" stroke="#d9dce3" stroke-width="2"/><text x="800" y="828" text-anchor="middle" class="body ink">Un audit peut être un indicateur parmi d’autres — pas nécessairement la mesure de toute la maturité.</text></svg>