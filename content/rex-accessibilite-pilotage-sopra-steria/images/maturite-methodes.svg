<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Plusieurs façons de mesurer la maturité</title><style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}.bg{fill:#f7f6f2}.ink{fill:#151d34}.muted{fill:#657083}
    .blue{fill:#164791}.violet{fill:#4631d4}.cream{fill:#f3eee3}.white{fill:#fff}
    .title{font-size:42px;font-weight:800}.subtitle{font-size:22px}.eyebrow{font-size:17px;font-weight:800;letter-spacing:2px}
    .h2{font-size:27px;font-weight:800}.body{font-size:21px;font-weight:500}.small{font-size:17px}
    .wt{fill:#fff}
    </style><rect width="1600" height="900" class="bg"/><text x="90" y="82" class="title ink">Plusieurs façons de mesurer la maturité</text>
<text x="90" y="122" class="subtitle muted">Les modèles ne proposent pas tous les mêmes dimensions, ni la même manière de décrire la progression.</text>
<rect x="90" y="175" width="680" height="575" rx="28" class="white" stroke="#d9dce3" stroke-width="2"/><rect x="90" y="175" width="680" height="92" rx="28" class="blue"/><text x="130" y="232" class="h2 wt">W3C — Maturity Model</text>
<text x="130" y="305" class="eyebrow blue">UNE VISION PAR CAPACITÉS</text><text x="130" y="345" class="body ink">Observer où se situe l’organisation,</text><text x="130" y="375" class="body ink">identifier les écarts et planifier</text><text x="130" y="405" class="body ink">les améliorations.</text>
<text x="130" y="465" class="body ink">• politiques et stratégie</text><text x="130" y="510" class="body ink">• gouvernance et organisation</text><text x="130" y="555" class="body ink">• processus et pratiques</text><text x="130" y="600" class="body ink">• résultats et amélioration</text><text x="130" y="670" class="eyebrow muted">LOGIQUE</text><text x="130" y="708" class="body ink">mesurer → écarts → améliorer</text>
<rect x="810" y="175" width="700" height="575" rx="28" class="white" stroke="#d9dce3" stroke-width="2"/><rect x="810" y="175" width="700" height="92" rx="28" class="blue"/><text x="850" y="232" class="h2 wt">DAMM</text>
<text x="850" y="305" class="eyebrow blue">DIMENSIONS + NIVEAUX</text><text x="850" y="345" class="body ink">Évaluer plusieurs dimensions du programme</text><text x="850" y="375" class="body ink">et situer chacune dans une progression.</text>
<text x="850" y="435" class="small muted">7 dimensions : gouvernance · communication · développement</text><text x="850" y="463" class="small muted">support · achats · compétences · culture</text>
<g transform="translate(850,510)"><rect width="88" height="54" rx="12" class="cream"/><text x="44" y="34" text-anchor="middle" class="small ink">Ad hoc</text><rect x="100" width="100" height="54" rx="12" class="cream"/><text x="150" y="34" text-anchor="middle" class="small ink">Réactif</text><rect x="212" width="112" height="54" rx="12" class="cream"/><text x="268" y="34" text-anchor="middle" class="small ink">Structuré</text><rect x="336" width="108" height="54" rx="12" class="cream"/><text x="390" y="34" text-anchor="middle" class="small ink">Proactif</text><rect x="456" width="112" height="54" rx="12" class="cream"/><text x="512" y="34" text-anchor="middle" class="small ink">Optimisé</text><line x1="0" y1="72" x2="560" y2="72" stroke="#164791" stroke-width="5"/><polygon points="568,72 548,62 548,82" class="blue"/></g>
<text x="850" y="650" class="eyebrow muted">LOGIQUE</text><text x="850" y="688" class="body ink">dimensions → niveau → progression</text>
<rect x="90" y="790" width="1420" height="60" rx="18" class="ink"/><text x="800" y="828" text-anchor="middle" class="body wt">Ces niveaux appartiennent au modèle : il n’existe pas une échelle universelle.</text></svg>